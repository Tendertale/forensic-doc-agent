# 法医尸表检验文书整理 Agent —— 通过服务器上既有的 nginx 容器对外提供服务
#
# 适用场景：服务器已有一个 nginx 容器（绑定 80/443）与通配 SSL 证书，
#          希望用「子域名 + HTTPS」让服务常驻可访问，而不是每次从本机开 SSH 隧道。
#
# 放置（示例路径，按你的实际挂载调整）：
#   /opt/proxy/nginx/conf.d/forensic-doc-agent.conf     # 该目录已 bind 到容器 /etc/nginx/conf.d
# 生效：
#   docker exec nginx nginx -t && docker exec nginx nginx -s reload     # reload 是平滑的，不影响其它站点
#
# 前置条件：
#   1) 应用监听 0.0.0.0:9765（否则同机容器访问不到宿主机的 127.0.0.1）：
#        sudo bash /opt/forensic-doc-agent/deploy/install.sh --bind 0.0.0.0 --basic-auth '用户名:口令' --no-seed
#   2) DNS：为子域名添加 A 记录指向服务器公网 IP（Cloudflare 可开启代理；源站证书用 Cloudflare Origin CA 即可）；
#   3) 防火墙/安全组只需放行 80/443 —— 9765 **不要**对公网放行（应用鉴权只是兜底，不是边界）。
#
# 注意：nginx 容器访问宿主机要走 docker 网桥网关（不是 127.0.0.1）。
#       用 `docker inspect <nginx容器> --format '{{range .NetworkSettings.Networks}}{{.Gateway}}{{end}}'` 查实际网关。

server {
    listen 80;
    server_name forensic.example.com;                 # ← 换成你的子域名

    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name forensic.example.com;                 # ← 同上

    ssl_certificate     /etc/nginx/ssl/api.pem;       # ← 通配/对应子域名的证书（容器内路径）
    ssl_certificate_key /etc/nginx/ssl/api.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 案件材料不允许被搜索引擎收录
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # 材料/照片以 base64 上传，留足请求体；导出 PDF 会同步等 LibreOffice，放宽读超时
    client_max_body_size 64m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://172.19.0.1:9765;             # ← 换成 docker 网桥网关:端口
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 应用层 HTTP Basic Auth（FORENSIC_BASIC_AUTH）依赖这个头
        proxy_set_header Authorization     $http_authorization;
    }

    # 如需在 nginx 层再加一道 Basic Auth（可选，与上面应用层二选一，避免双重弹窗）
    # auth_basic           "法医尸表检验文书整理 Agent";
    # auth_basic_user_file /etc/nginx/.htpasswd;
}
