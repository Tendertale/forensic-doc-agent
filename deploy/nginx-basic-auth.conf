# 【可选·默认不启用】Nginx 反代 + TLS + Basic Auth
#
# 重要：应用自身**没有登录鉴权**（`expected_version` 只是乐观锁，不是权限控制）。
# 司法鉴定类材料上公网前必须加一层访问控制。默认部署只监听 127.0.0.1，用 SSH 隧道访问；
# 只有明确需要公网访问时才启用本文件，且**不要**直接改动服务器上已有的 nginx/Docker 配置，
# 请先确认端口与站点归属（服务器上 80/443/8443 已由 nginx 容器占用）。
#
# 依赖：
#   apt-get install -y --no-install-recommends nginx apache2-utils certbot python3-certbot-nginx
#   htpasswd -c /etc/nginx/.htpasswd forensic      # 交互式设置密码
#
# 证书： certbot --nginx -d 你的域名
# 放置： /etc/nginx/conf.d/forensic-doc-agent.conf  然后 nginx -t && systemctl reload nginx

server {
    listen 443 ssl http2;
    server_name forensic.example.com;            # ← 换成你的域名

    ssl_certificate     /etc/letsencrypt/live/forensic.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forensic.example.com/privkey.pem;

    # 案件材料默认禁止被搜索引擎收录
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # 单次请求体上限：文档/照片上传走 base64，留足余量
    client_max_body_size 64m;

    # 生成文稿会同步等 LibreOffice 出 PDF，超时要放宽
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    auth_basic           "法医尸表检验文书整理 Agent";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:9765;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name forensic.example.com;
    return 301 https://$host$request_uri;
}

# 更稳妥的替代方案（无需域名/证书）：
#   只开 SSH 隧道  ssh -N -L 9765:127.0.0.1:9765 forensic@<服务器IP>
# 或者用 WireGuard/Tailscale 组网后再访问 127.0.0.1:9765。
